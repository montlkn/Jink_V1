# fly.toml app configuration file generated for architecture-app-worker on 2025-10-17T15:33:26-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'architecture-app-worker'
primary_region = 'ord'

[build]
  dockerfile = 'apps/server/Dockerfile.worker'

[env]
  AI_FALLBACK_MODEL = 'gemini-2.0-flash'
  AI_GENERATION_ENABLED = 'true'
  AI_PRIMARY_MODEL = 'gemini-2.0-flash-lite'
  NODE_ENV = 'production'

[[vm]]
  memory = '512mb'
  cpus = 1
