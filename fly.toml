# fly.toml app configuration file generated for architecture-app-api on 2025-10-17T15:18:28-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'architecture-app-api'
primary_region = 'ord'

[build]
  dockerfile = 'apps/server/Dockerfile'

[env]
  AI_FALLBACK_MODEL = 'gemini-2.0-flash'
  AI_GENERATION_ENABLED = 'true'
  AI_PRIMARY_MODEL = 'gemini-2.0-flash-lite'
  BREAKER_THRESHOLD_PCT = '15'
  DAILY_CAP = '5'
  DIVERGENCE_THRESHOLD_PCT = '6'
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[services]]
  protocol = 'tcp'
  internal_port = 8080

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '10s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[[metrics]]
  port = 9090
